# Dictation settings. Edit this file and restart the app.

[hotkey]
# Key name. If it is not picked up, find its scan code with `run.ps1 keytest`
# and put the number in scancode (then name is ignored).
name = "f13"
scancode = 0
# The "that's wrong" key: opens the last take; fix a word and it is remembered forever.
fix_hotkey = "shift+f13"
# The "that was a question" key: flips the final mark of the last take
# between "." and "?", and fixes the text you already pasted. Press it right
# after dictating, while the cursor still sits after the text. A question and a
# statement differ only by voice, and the voice carries no usable signal
# (measured 2026-08-14: 2 caught out of 117) — so you decide, with one key.
# Set to "" if you do not want it.
flip_hotkey = "ctrl+f13"
# A tap shorter than this = hands-free recording until the next press.
# Holding the key = records while held.
# Since 01.10.2026 the press that ends hands-free stops at its RELEASE, however
# long it is held: a tap nobody noticed followed by a held phrase is one take,
# not a fragment plus a lost phrase (9 such splits in September). A press while
# the previous take is still recording its tail continues that take.
tap_ms = 350
# A hands-free take nobody speaks in (a tap nobody meant) is cancelled after
# this many seconds of its own sound. 01.10.2026: one ran 300 s with all other
# audio at 15%; since 10.08 the journals have 17 takes of 45+ s with at most a
# dozen words. Replayed on 103 takes of 45+ s: at 90 no real dictation is lost
# (at 45 one was: its first words came 130 s in). 0 = off.
handsfree_silent_cancel_s = 90
# A hands-free take that was spoken in and then stayed quiet this long is ended
# like a stop: recognized and pasted. Speech AFTER that point is not recorded,
# so this sits well above the longest pause inside a real dictation in the
# journals (61 s by the speech detector, 81 s by the level rule). 0 = off.
handsfree_idle_stop_s = 120
# What counts as voice for those two rules: rms of a 0.3 s window, 3 of the last
# 4 windows (a click or a cough does not count). 0.004 = -48 dBFS: median speech
# window 0.052, a quiet room 0.001. Relies on keep_gain holding the level.
handsfree_voice_rms = 0.004
# Safety net: the maximum number of seconds to record if you forget to stop.
max_seconds = 300

[mic]
# Part of the microphone name. Empty = the Windows default microphone.
name = "PodMic"
samplerate = 16000
# Where to take the sound from.
# "raw"    — straight off the device (WDM-KS), past every Windows "enhancement".
#            The PodMic's capture endpoint carries a processing pack installed
#            with RODE Central; measured on 2026-08-23 it was eating twelve
#            decibels and every pause, and it adapts during a long phrase (a
#            29-second take slid from 0.10 to 0.02 while it was being spoken,
#            which is why repeating the same sentence came out right). The raw
#            path is exclusive: while dictation holds the mic, nothing else can
#            record — see hot_ms.
# "shared" — the old way, through the Windows mixer. Other programs can record
#            at the same time, and the sound comes back processed.
path = "raw"
# How long to keep holding the microphone after a take, in milliseconds.
# Opening it costs 105 ms, and people start talking as they press: between 26%
# and 42% of takes used to begin with the first syllable already missing
# ("Читайся" for "Отчитайся"). While it is held, the sound from before the key
# press is kept, so nothing is lost. 0 = let go at once (then other programs
# can always record, but first syllables go back to being cut).
#
# Was 60000 until 29.08.2026. Measured over 2206 takes from the 20th to the
# 29th: 68% of them carried no pre-roll at all, and those had to be re-dictated
# or were marked bad three times as often (2.19% against 0.72%). Of the takes
# that came less than a minute after the previous one — where this timer had
# not run out yet — 47% still arrived empty, because the microphone was being
# let go on every window switch (see yield_to below). Half an hour covers a
# normal working gap; the mic is still handed over at once to the programs in
# yield_to.
hot_ms = 1800000

# Programs that get the microphone back the moment their window comes to the
# front. Everything else waits: while dictation holds the mic on the raw path
# nothing else can record, and that hold is exactly what keeps the pre-roll
# full.
# Browsers are deliberately absent — dictation goes into a browser all day, and
# adding one would bring back the empty pre-roll and the chewed-off first half
# of the phrase. If you take calls in a browser tab, add "chrome.exe" here and
# accept that cost, or press the dictation key once before speaking in the call
# (releasing it hands the microphone over).
yield_to = ["Zoom.exe", "Teams.exe", "ms-teams.exe", "Skype.exe", "Discord.exe",
            "Telegram.exe", "Webex.exe", "WebexHost.exe", "obs64.exe",
            "Audacity.exe", "slack.exe"]
# Standing in front is no longer enough to take the microphone: the program has
# to be recording, or plausibly about to. Measured on 31.08.2026 — Slack had
# not recorded a second since 13.08 and Telegram one minute all day, yet
# between them they were taking the mic away all day long, and a third of the
# takes started with an empty pre-roll, i.e. with the first syllable gone.
#
# Our capture is exclusive, so a program cannot just take the microphone when
# it needs it — it has to be given a gap. So when a listed program comes to the
# front it gets the microphone free for yield_probe_s, and while it stays in
# front that chance comes round every yield_probe_every_s. Start a call and
# Windows marks it as recording, and the microphone stays free for the whole
# call plus yield_grace_s (a mute or a screen share closes the stream for a
# moment and must not count as the end). Ignore the microphone and dictation
# takes it straight back, pre-roll and all.
yield_probe_s = 2.5
yield_probe_every_s = 25.0
yield_grace_s = 120.0
# A program that really has recorded on this machine within yield_known_s gets
# its chance this often instead — a call must not wait half a minute to start.
# Zoom qualifies (a call on 31.08 at 19:01); Slack does not (nothing since
# 13.08), and neither does Telegram (one minute in a whole day).
yield_probe_hot_every_s = 4.0
yield_known_s = 86400.0
# How much sound from before the key press to keep, in milliseconds.
preroll_ms = 500

# The microphone's own gain — the Windows "level" slider. On the PodMic USB it
# is the preamp inside the microphone, 22..63 dB, and any program built on
# WebRTC (Chrome, Zoom, Telegram) moves it and leaves it moved. On 21.08.2026 it
# was pushed to 63 dB and the takes crackled with clipping; by 23.08 it sat at
# 42.8 dB and speech peaked at a tenth of full scale. Both days looked like a
# broken microphone and were nothing of the kind.
# true = dictation holds the level itself and tunes it after every take.
keep_gain = true
# What a take should peak at. 0.5 leaves room for a shout without clipping.
target_peak = 0.5
# Never leave these, whatever the tuning says. 63 dB is where 21.08 clipped.
min_db = 34.0
max_db = 58.0
# The largest change after a single take.
max_step_db = 6.0
# How long to keep recording AFTER the key is released. People release the key
# while still finishing the last word, and that word was being lost: a
# measurement on 2026-08-15 found 47% of takes cut off mid-sound, without a
# single quiet frame at the end.
# It does not always wait the full time: as soon as silence starts, it stops.
# Release during a pause and the delay is almost nothing.
# Raised from 400 on 01.10.2026: of 1855 takes (17-30.09) 24 (1.3%) were cut at
# the 400 ms limit while the voice was still audible. Silence is now counted in
# sound actually received (blocks of 85 ms), not in 20 ms polls. Replayed on 479
# recordings: about 10 ms later when released in a pause, 40-60 ms later when
# released as the word ends.
tail_ms = 700
# How many milliseconds of continuous silence count as the end of a phrase.
tail_quiet_ms = 120

[asr]
# large-v3-turbo: on this voice it was both 4x faster and more accurate than
# large-v3. Put "large-v3" here if you want to compare.
model = "large-v3-turbo"
# A second model, for SHORT takes only. One or two seconds is where turbo
# breaks: there is nothing around the words to lean on, so it guesses, and a
# guess on a three-word order means saying it again.
#
# Measured 10.09.2026 over 258 short takes from the previous six days. The two
# models wrote different text on 115 of them; twelve judges, told only "which
# of these two is what a person actually said" and not which model was which,
# picked large-v3 in 32 takes and turbo in 14 (the rest were the same words).
# What it fixes is exactly what had to be re-dictated that day:
#   Чиньёба цикета            -> Чинь оба тикета
#   Вочисть его, конечно      -> Очисти его, конечно
#   Пластический клиент       -> Платящий клиент
#   Аксим / Версара / лавиш   -> Максим / Vercel / Lavish
# On LONG takes it was the other way round then and four times slower (1.15 s
# against 0.27 s), so the switch is by length, not for everything. With the
# later long-take fixes (timestamps, the hint over every window, no penalty on
# repeated words) large-v3 won up to 60 s as well - see short_seconds.
# Costs 3 GB of video memory and 4 seconds at start-up. Empty = off.
short_model = "large-v3"
# Takes up to this many seconds go to that model. Above it, turbo.
# At three seconds this is about a quarter of all takes and adds 0.35 s to them.
# Was 3.0 until 11.10.2026. Measured then on 160 random takes of 3-20 s from
# the ten days before, both models read with the live settings: they wrote
# different words in 86; three blind judges (majority) preferred large-v3 in 31
# and turbo in 11 (44 even). By length: 3-6 s 12 to 1, 6-12 s 11 to 9, 12-20 s
# 8 to 1. Past 20 s it was not measured and timestamps take over at 25 s.
# Was 20.0 until 12.10.2026. Measured then on 60 random takes of 20-90 s from
# the ten days before, both models read with the live long-take settings
# (timestamps and the hint over every window past 25 s): different words in 52;
# three blind judges (majority) preferred large-v3 in 23 and turbo in 10 (19
# even). By length: 20-30 s 14 to 4, 30-60 s 9 to 3, over 60 s 0 to 3 (only 4
# takes; there turbo spelled the terms better and large-v3 dropped a few
# words). The price is time: large-v3 reads 4-5 times slower than turbo, so a
# 30 s take is pasted about 1.5 s later and a 60 s one about 3 s later.
short_seconds = 60.0
# Takes longer than this many seconds are read with timestamps. The recognizer
# reads sound in 30-second windows, and without timestamps whatever it did not
# finish in one window was skipped. Measured 30.09.2026 over September: of 136
# takes with more than 30 s of speech, 78 lost words that way (about 1,300 in
# all), and some came out with "Продолжение следует..." on the end. Costs about
# 0.2 s on those takes only. 0 = the old way everywhere.
timestamps_after_s = 25.0
# With condition_on_previous_text off, faster-whisper gives the hint to the FIRST
# 30-second window only; every later window of a long take was read without the
# glossary and the punctuation style. true passes the same hint as hotwords,
# which goes in front of EVERY window; window one stays token-for-token the same
# (the hint is ~205 tokens, the limit 223). Measured 01.10.2026 on 139 takes
# with more than 30 s of speech: 118 differ; twelve blind judges preferred it on
# 77 against 28 (12 even). A last window that echoes the hint instead of speech
# is read again the old way (asr.py, _without_echo). Long takes only.
hint_every_window = true
# Re-read a take with timestamps when its text is too short for its speech, and
# keep the new text only if it is clearly fuller. Measured 01.10.2026 on 1,811
# takes: it would have changed 1 in three weeks, at ~8 ms on every take. Off.
reread_early_end = false
device = "cuda"
compute_type = "float16"
language = "ru"
# A take that sounds English is read as English (30.10.2026): above this share of
# "en", by the recognizer's own language check. Held at "ru", it now and then
# translates English speech, a whole sentence pasted as its Russian translation.
# Measured on the Mac over 20 days of takes: of 600 Russian ones (80 of them full
# of English terms) none above 0.7, the highest 0.66, on a call; English takes
# translated live, 5 of 47 that followed an English take, all at 0.86 and up.
# Read with "en", 19 of 62 English takes changed: 10 translations or nonsense
# came back as the English said, 8 differ in a word or a mark, one term was
# lost ("your Claude" -> "your cloud"). 0 = off.
english_above = 0.7
# ...asked only within this many seconds of a take that came out in English. The
# check is a pass of the model over the sound: 67 ms on a 3.6 s take, 113 ms on a
# 35 s one (30.10.2026), on every take. The 5 translations above came 5 to 36 s
# after an English take; within 300 s fall 5% of all takes. 0 = every take.
english_window_s = 300
# A wider beam. On turbo it costs a hundredth of a second and makes fewer
# errors: 17.0% against 17.8% on 377 real takes. Set 1 if you want it faster.
beam_size = 5
# Penalty on words the recognizer has already written. 1.15 until 08.10.2026:
# it dropped words the speaker really repeated, fillers, once a whole clause.
# Measured on 300 takes of 5 s and more: without it 62 takes came out fuller,
# 30 shorter; three blind judges preferred it 64 to 17. A reading that loops is
# retried with 1.15 (asr.py, LOOP_PENALTY). 1.0 = no penalty.
repetition_penalty = 1.0
vad = true
# How many glossary terms to feed the recognizer up front (it chokes above 60).
prompt_terms = 45
# "commands" — imperative verbs + terms. Inverts the meaning half as often
#              ("do it" -> "I will do it"), overall accuracy 0.4% lower.
# "list"     — terms only. More accurate on average, breaks orders more often.
# "sample"   — a natural sentence containing the terms.
prompt_style = "commands"
# The terms of the conversation the take goes into, first in the hint: when the
# window in front is Claude in herdr, its session's recent messages are read
# and their terms (glossary ones, then names and acronyms in Latin letters that
# turn up twice or more) take up to context_terms places after the pinned
# names. 23.10.2026: «ICP» came out as «ACP» and «IBM» all evening — it was in
# the glossary but not among the 45. See stt/context.py.
# Measured 24.10.2026 on 208 takes of 20-24.10 (Mac, live settings): 51 read
# differently, three blind judges: window's hint better 8, usual better 10,
# 33 alike. It finds the new names (Anthropic, Grok, CSDD) but any change of
# the hint shifts the reading elsewhere too («PostHog» -> «постхога»). Given
# to the corrector instead, the same terms changed 24 takes of 197, all of it
# punctuation. Off: no gain either way with today's models.
context_hint = false
context_terms = 15

[cloud]
# Long takes are read by ElevenLabs Scribe (stt/cloud.py). Measured 30.10.2026 on
# 200 takes from 27-30.10, read both ways with the same terms and dictionary and
# judged blind by six judges: from 20 s on, 19 errors there against 35 here, and
# the answer in 2.1 s against 2.5 s; 5-20 s, 22 against 30 but 0.4 s slower;
# under 5 s, no better and 0.8 s against 0.3 s. A take another program recorded
# too (a call) is never sent. Without a key, or when it fails, the take is read
# here. The key: ELEVENLABS_API_KEY in the environment, or in key_file.
enabled = true
min_seconds = 20
model = "scribe_v2"
key_file = "~/.secrets/speech-cloud.env"
# How long to wait for the answer: timeout_s + timeout_per_s per second of
# speech. The slowest of the 50 long takes answered in 3.8 s (69 s of speech).
timeout_s = 4.0
timeout_per_s = 0.1

[polish]
# Tidying the text with a second model through LM Studio (OpenAI-compatible API).
# The big Qwen3.8-27B on :8099 is a night-only thing for the article conveyor and is
# not used here (operator's call, 2026-08-21). Any other server would work too:
# url + api_key_file below; measured on :8099 that day - 0.4-1.0 s a take.
enabled = true
url = "http://127.0.0.1:1234"
# Bearer key the server wants; a path to a file holding it. Empty = no key.
api_key_file = ""
# Measured on real takes: 0.35 s per line, holds 18 GB of VRAM (only 3 of its
# 30 billion parameters are active at a time, which is why it is fast).
# It restores question marks noticeably better than a small model: 6 of 7
# against 4 of 7, at the cost of one false mark per 7 statements.
# Lighter and safer: "qwen3-4b-instruct-2507" — 3 GB, same speed, no false
# marks at all, but it catches fewer questions.
# Empty = use whatever model is IN MEMORY in LM Studio right now. Dictation
# never swaps or unloads a model: the model in VRAM belongs to whoever put it
# there. Swap it and dictation follows within twenty seconds.
# A name written here is only a preference — if that model is not in memory,
# the loaded one wins. To pin one, choose it on the Model tab of the page.
model = "qwen3-4b-instruct-2507"
# The one exception: LM Studio is running with NOTHING in memory, inside
# autoload_hours. Then dictation loads this model itself (lms load, context
# autoload_context), and if the load hangs for 90 s, restarts the empty
# LM Studio once and tries again; one try per 15 minutes. A stopped LM Studio
# is started too, but only inside these hours (the night belongs to the
# robotics runs). 24.10.2026: the morning restore hung and the corrector was
# off from 07:35 to 15:37; 29.10: that morning task was gone, off until 09:10.
# Empty = never load.
autoload = "qwen3-4b-instruct-2507"
autoload_hours = "07:40-22:50"
autoload_context = 4096
# "light"  — punctuation, capitals and terms only. Your words are untouched.
# "clean"  — also removes fillers, repeats and slips. Smoother text, but that is
#            editing your speech.
mode = "light"
timeout_s = 4.0
# Phrases shorter than this many words are not sent to the corrector. It used
# to be 4, and because of that every fourteenth take ("Что странно.", "Когда
# можно будет.") came out with no question mark and no capital letter. All 34
# such phrases were run through the corrector: it fixed exactly those cases,
# left the other 30 alone, and cost 78 ms. The old fear that the corrector runs
# wild on short input is handled by the lock in polish.py::constrain, which
# rolls back anything extra.
min_words = 1
# Who decides the question marks.
# "heard"     — the recognizer does, with one narrow exception. The corrector may
#               move a mark between sentences, and may add one the recognizer
#               did not hear ONLY on a sentence that opens as a real question: a
#               question word among the first six words, no ", а/но/и" after it,
#               and not somebody else's question passed on ("он спросил, где…"),
#               not an order ("…, открой, проверь цифры"), not a statement of
#               need ("мне надо понять, откуда цифры…"). Since 20.08.2026, after the
#               corrector invented 5 wrong marks out of 7 in five days. Replayed
#               01.10.2026 over the 177 such marks in the journals (10.08-01.10):
#               41 were wrong; the stricter rules take off 24 of them and 2 of 95
#               correct ones.
# "corrector" — the old way: it may restore a question the recognizer missed.
#               Catches 36 questions out of 43 instead of 33, and pays with
#               marks it made up. ctrl+f13 puts a missing mark back by hand.
#
# Since 22.08.2026 a mark the recognizer DID hear is never removed, not even on
# a phrase shaped as an order. Until then "Посмотри, с чем связано ухудшение?"
# came back as a full stop. Across twelve days of logs the recognizer put a "?"
# on an order-shaped phrase 37 times and all 37 were real questions, so the
# rule was only ever destroying them.
questions = "heard"
# Ask the recognizer a second time, differently: which ending fits the
# recording better, "." or "?". It writes the mark in one pass and never looks
# back, so a question asked without a question word ("Мы ссылки сделали на эти
# статьи?") comes out as a statement — and 14 of the 24 questions lost over
# 08-10.09.2026 were exactly that kind. Runs only when neither the recognizer
# nor the corrector found a question, and costs 60 ms on those takes.
sound_questions = true
# How much more the sound must look like a question than like a statement.
# Measured over those three days (421 takes, 148 of them real questions):
#   off    124 questions delivered of 148, 12 marks on statements
#   -1.0   129 of 148, still 12  <- chosen: five saved, nothing broken
#   -1.5   132 of 148, 13
#   -2.0   134 of 148, 14
#   -3.0   136 of 148, 15
# Lower it if a lost question annoys more than a stray mark. Note that a mark
# on an order makes an agent ask back instead of working, which is why the
# safe end was taken.
sound_threshold = -1.0
# If the result differs in length by more than this factor, the model has run
# off the rails and the raw recognition is used instead.
max_growth = 1.6

[duck]
# Duck other applications while recording: hold the key and YouTube and music
# go quiet, release it and they come back. Our own volume is never touched.
enabled = true
# What fraction of the volume to drop to. 0.15 = 15%: audible in the
# background but not in the way. 0.0 = complete silence.
level = 0.15
# Who NOT to touch. Process names as in Task Manager, e.g. ["Zoom.exe"].
exclude = []

[paste]
hotkey = "ctrl+v"
restore_clipboard_after_s = 1.0

[learn]
enabled = true
# How many times the model must fix the same word before it is kept forever.
promote_after = 2
# Keep the audio — needed to fine-tune the recognizer on your voice later.
keep_audio = true

[endings]
# An order versus a promise: "do it" and "I will do it".
#
# The corrector does the real work here — it sees the meaning of the sentence,
# and the lock lets through ONLY a verb-form flip from the list in
# stt/endings.py. That always runs and needs no configuration.
#
# Below is the blind rule: "by verb list, ignoring meaning". On 377 real takes
# it fired 10 times, 5 of them wrong ("I will go and see" -> "go and see").
# Hence it is off by default. Turn it on only if the corrector is not coping and
# you accept errors in the other direction.
enabled = false

[repaste]
# "Paste the last take again" — for when the text went into the wrong window.
# Point the mouse at the right window and press the button: the app brings it
# forward and pastes the last text there.
enabled = true
# The Forward button on a G502 — the middle of the three under the thumb.
# The top one is F13 (dictation), the bottom one is push-to-talk: leave both.
button = "x2"
# Swallow the button so it does not also do its usual job (for the side
# buttons that is back/forward in a browser). Off by default: let it do both,
# there are fewer surprises that way.
suppress = false
# A keyboard fallback if the mouse does not suit. Empty = not needed.
key = ""

[web]
# The page with every take: read, copy, fix, mark.
# Lives on this machine only and does not face the outside world.
enabled = true
port = 8756
open_on_start = false

[hud]
enabled = true
size = 16
margin = 28
# Which screen the dot sits on (bottom-right corner): "primary", "left"
# (the leftmost screen) or "right".
screen = "left"

[handsfree]
# One press starts recording, the next stops it — nothing to hold.
# Written by `run.ps1 bindtoggle`.
# 28.08.2026: unbound at Anton's request - it stole the Print Screen key and
# screenshots stopped working. Tapping f13 still toggles hands-free.
enabled = false
key = ""
button = ""
# Swallow the key so Windows does not also do its usual job with it.
# Print Screen without this opens the Snipping Tool on every recording.
suppress = true
