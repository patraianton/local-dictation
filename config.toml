# Настройки диктовки. Правь этот файл и перезапускай программу.

[hotkey]
# Имя клавиши. Если распознаётся плохо — узнай скан-код командой `run.ps1 keytest`
# и впиши его числом в scancode (тогда name игнорируется).
name = "f13"
scancode = 0
# Клавиша «не то»: открывает окошко с последней диктовкой, правишь слово — запомнит навсегда.
fix_hotkey = "shift+f13"
# Клавиша «это был вопрос»: меняет знак в конце последней диктовки, точка <-> «?»,
# и правит уже вставленный текст. Нажимать сразу после диктовки, пока курсор
# стоит за текстом. Вопрос от утверждения отличается только голосом, а по голосу
# он не ловится (замер 14.08.2026: 2 из 117) — поэтому решаешь ты, одной кнопкой.
# Не нужна — поставь "".
flip_hotkey = "ctrl+f13"
# Короткое нажатие (меньше этого) = запись без рук, идёт до следующего нажатия.
# Долгое (зажал и держишь) = пишет, пока держишь.
tap_ms = 350
# Страховка: сколько секунд максимум писать, если забыл выключить.
max_seconds = 300

[mic]
# Часть названия микрофона. Пусто = микрофон Windows по умолчанию.
name = "PodMic"
samplerate = 16000
# Сколько дописывать ПОСЛЕ отпускания клавиши. Клавишу отпускают, ещё договаривая
# последнее слово, и оно пропадало: замер 15.08.2026 показал, что 47% записей
# обрывались на звуке, без единого тихого кадра в конце.
# Ждём не всегда до упора: как только пошла тишина — останавливаемся. Если ты
# отпустил уже в паузе, задержки почти нет.
tail_ms = 400
# Сколько миллисекунд тишины подряд считать концом фразы.
tail_quiet_ms = 120

[asr]
# large-v3-turbo: на твоём голосе оказалась и быстрее в 4 раза, и точнее, чем large-v3.
# Если захочешь сравнить — впиши "large-v3".
model = "large-v3-turbo"
device = "cuda"
compute_type = "float16"
language = "ru"
# Широкий поиск. У turbo он стоит одну сотую секунды, а ошибок даёт меньше:
# на твоих 377 записях 17,0% против 17,8%. Поставь 1, если захочешь ещё быстрее.
beam_size = 5
vad = true
# Сколько терминов из словаря подсовывать распознавалке заранее (больше 60 она не переварит).
prompt_terms = 45
# "commands" — глаголы-приказы + термины. Вдвое реже переворачивает смысл
#              («сделай» -> «сделаю»), общая точность ниже на 0,4%.
# "list"     — только термины. Точнее в среднем, но чаще ломает приказы.
# "sample"   — живая фраза с терминами.
prompt_style = "commands"

[polish]
# Причёсывание текста второй моделью через LM Studio.
enabled = true
url = "http://127.0.0.1:1234"
# Проверено на твоих записях: 0,35 с на реплику, держит 18 ГБ видеопамяти
# (у неё из 30 миллиардов работают только 3, поэтому она быстрая).
# Вопросительные знаки возвращает заметно лучше маленькой: 6 из 7 против 4 из 7,
# ценой одного лишнего знака на 7 утверждений.
# Полегче и побезопаснее — "qwen3-4b-instruct-2507": 3 ГБ, та же скорость,
# ни одного лишнего знака, но и вопросов ловит меньше.
# Пусто = брать ту модель, что сейчас загружена в LM Studio. Это удобно, когда
# модель меняешь: включил новую — диктовка подхватит её сама.
# Хочешь закрепить конкретную — выбери её на вкладке Model на странице,
# имя запишется сюда само.
model = ""
# "light"  — только знаки препинания, заглавные и термины. Твои слова не трогает.
# "clean"  — плюс убирает «ээ», повторы и оговорки. Текст глаже, но это уже правка речи.
mode = "light"
timeout_s = 4.0
# Фразы короче этого числа слов корректору не отдаём. Стояло 4 — из-за этого
# каждая четырнадцатая диктовка («Что странно.», «Когда можно будет.») оставалась
# без вопросительного знака и без заглавной буквы. Прогнали все 34 такие фразы
# через корректор: починил ровно эти три случая, остальные 30 не тронул, цена
# 78 мс. Старый страх «на коротком корректор понесёт» закрыт замком в
# polish.py::constrain — он всё лишнее откатывает.
min_words = 1
# Сколько секунд LM Studio держит модель в видеопамяти после последнего запроса.
# Иначе первая диктовка после перерыва ждёт загрузку ~2 секунды.
keep_loaded_s = 3600
# Если результат отличается по длине больше чем во столько раз — модель «поехала»,
# вставляем сырое распознавание.
max_growth = 1.6

[duck]
# Приглушать чужой звук, пока идёт запись: зажал клавишу — YouTube и музыка
# становятся тихими, отпустил — вернулись как были. Своей громкости не касаемся.
enabled = true
# До какой доли громкости опускать. 0.15 = 15%, слышно фоном, но говорить не мешает.
# 0.0 = полная тишина.
level = 0.15
# Кого НЕ трогать. Имена процессов как в диспетчере задач, например ["Zoom.exe"].
exclude = []

[paste]
hotkey = "ctrl+v"
restore_clipboard_after_s = 1.0

[learn]
enabled = true
# Сколько раз модель должна починить одно и то же слово, чтобы оно попало в словарь навсегда.
promote_after = 2
# Хранить звук — нужен для будущего дообучения распознавалки на твоём голосе.
keep_audio = true

[endings]
# Приказ против обещания: «сделай» и «сделаю».
#
# Основную работу делает корректор — он видит смысл предложения, а замок
# пропускает от него ТОЛЬКО переключение формы глагола из списка в
# stt/endings.py. Это работает всегда и настройки не требует.
#
# Ниже — слепое правило «по списку глаголов, без учёта смысла». На твоих 377
# записях оно дало 10 срабатываний, из них 5 неверных («схожу и посмотрю» ->
# «посмотри»). Поэтому по умолчанию выключено. Включай, только если корректор
# не справляется и ты готов к ошибкам в другую сторону.
enabled = false

[repaste]
# «Вставить последнюю диктовку ещё раз» — когда текст улетел не в то окно.
# Наводишь мышь на нужное окно, жмёшь кнопку — программа делает это окно
# активным и вставляет туда последний текст.
enabled = true
# Кнопка Forward на G502 — средняя из трёх под большим пальцем.
# Верхняя занята под F13 (диктовка), нижняя под «press to speak» — не трогаем.
button = "x2"
# Перехватывать кнопку, чтобы она не делала свою обычную работу
# (у боковых это «назад/вперёд» в браузере). По умолчанию НЕ перехватываем:
# пусть делает и то, и другое, так меньше сюрпризов.
suppress = false
# Запасной вариант с клавиатуры, если мышь не подходит. Пусто = не нужен.
key = ""

[web]
# Страница со всеми диктовками: посмотреть, скопировать, поправить, пометить.
# Живёт только на этом компьютере, наружу не смотрит.
enabled = true
port = 8756
open_on_start = false

[hud]
enabled = true
size = 16
margin = 28
